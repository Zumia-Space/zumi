[package]
name = "zumi-routines"
version = "0.0.1"
description = "T-31-MAUS A2 routines: form-based reminders (store, next-fire, quiet hours, wake after suspend, tool refusal). No tauri dependency."
authors = ["Zumia Space"]
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"
publish = false

# Standalone crate (not part of tauri/src-tauri) so building and testing it compiles no Tauri/WebView2 code, and a later
# workspace move is a path change only. Rule 3.7 (no new crate): Cargo.lock here is a SUBSET of tauri/src-tauri/Cargo.lock,
# same versions and checksums; `node scripts/check-zumi-hands-lock.mjs tauri/zumi-routines/Cargo.lock` proves it.
[dependencies]
serde_json = "1"
# Hands/routine audit log: a crate of this repository (tauri/zumi-audit), not an external crate.
zumi-audit = { path = "../zumi-audit" }

[target.'cfg(windows)'.dependencies]
# Only the local-time offset (SystemTimeToTzSpecificLocalTime). `windows` 0.62 is already in the app lock; features only.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Time"] }
